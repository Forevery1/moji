name: macOS 打包发布

# 应用 DMG 统一在 GitHub Actions 构建，本地不再打包。
# - 推送 v<版本> tag：构建后自动创建草稿 Release、上传全部资产并发布为正式 Latest。
# - workflow_dispatch（默认不发布）：仅构建并通过 SHA256 校验，产物存入 Actions 工件，用于演练。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建成功后创建草稿Release并发布为Latest
        type: boolean
        default: false
      release_title:
        description: Release标题（留空则使用默认）
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建双架构 DMG
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust（含双架构目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Rust 构建
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 核心检查
        run: npm run test:core

      - name: Rust 检查
        run: npm run test:rust

      - name: 构建与打包（复用发布脚本）
        run: python3 script/release.py --build

      - name: 校验产物
        run: |
          version=$(node -p "require('./package.json').version")
          cd release/macos
          for f in "Moji-$version-Apple-Silicon.dmg" "Moji-$version-Intel.dmg" \
                   "Moji-$version-PRD.md" "Moji-$version-CHANGELOG.md" \
                   "Moji-$version-SHA256SUMS.txt" "Moji-$version-build.json" latest.json; do
            test -s "$f" || { echo "缺少产物：$f"; exit 1; }
          done
          shasum -a 256 -c "Moji-$version-SHA256SUMS.txt"

      - name: 上传构建工件
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            release/macos/Moji-*
            release/macos/latest.json

      - name: 版本与tag一致性检查
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ -n "${{ github.ref_name }}" ] && [[ "$GITHUB_REF" == refs/tags/* ]] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 版本 $version 不一致，请使用 v<版本> 命名"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_ENV"

      - name: 发布 Release（草稿上传后设为Latest）
        if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          title="${{ inputs.release_title }}"
          [ -n "$title" ] || title="墨记 $version · 双架构 DMG"
          # 已正式发布的同名 Release 不自动改动，避免覆盖线上交付
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo 'none')
          if [ "$state" = 'false' ]; then
            echo "Release $tag 已正式发布，请先手动处理后再重跑"; exit 1
          fi
          if [ "$state" = 'true' ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          python3 -c "import json;open('/tmp/release-notes.md','w').write(json.load(open('release/macos/latest.json'))['body'])"
          cd release/macos
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$title" --notes-file /tmp/release-notes.md \
            "Moji-$version-Apple-Silicon.dmg" "Moji-$version-Intel.dmg" \
            "Moji-$version-PRD.md" "Moji-$version-CHANGELOG.md" \
            "Moji-$version-SHA256SUMS.txt" "Moji-$version-build.json" latest.json
          # 全部资产上传完成后再发布为正式 Latest
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets \
            --jq '{tag:.tagName,draft:.isDraft,prerelease:.isPrerelease,assets:[.assets[].name]}'
