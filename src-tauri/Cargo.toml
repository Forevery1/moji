[package]
name = "moji"
version = "0.8.1"
description = "墨记 AI Markdown Editor"
authors = ["Moji"]
edition = "2021"

[lib]
name = "moji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "fs", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
futures-util = "0.3"
toml = "0.8"
semver = "1"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

mcp-reqwest = { package = "reqwest", version = "0.13.2", default-features = false, features = ["rustls", "json", "stream", "system-proxy"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
